<svg viewBox="0 0 150 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="recipe">
<!-- Recipe book/card -->
<rect id="background" opacity="0.15" x="15" y="15" width="120" height="70" rx="3" fill="#AAAAAA"/>
<!-- Title -->
<rect id="title" opacity="0.55" x="20" y="20" width="80" height="8" rx="2" fill="#AAAAAA"/>
<!-- Image placeholder -->
<rect id="image" opacity="0.35" x="20" y="30" width="45" height="35" rx="2" fill="#AAAAAA"/>
<!-- Ingredient list -->
<g id="ingredients">
<circle cx="72" cy="32" r="2" fill="#AAAAAA" opacity="0.5"/>
<rect x="77" y="30" width="50" height="4" rx="1" fill="#AAAAAA" opacity="0.4"/>
<circle cx="72" cy="39" r="2" fill="#AAAAAA" opacity="0.5"/>
<rect x="77" y="37" width="45" height="4" rx="1" fill="#AAAAAA" opacity="0.4"/>
<circle cx="72" cy="46" r="2" fill="#AAAAAA" opacity="0.5"/>
<rect x="77" y="44" width="48" height="4" rx="1" fill="#AAAAAA" opacity="0.4"/>
<circle cx="72" cy="53" r="2" fill="#AAAAAA" opacity="0.5"/>
<rect x="77" y="51" width="42" height="4" rx="1" fill="#AAAAAA" opacity="0.4"/>
<circle cx="72" cy="60" r="2" fill="#AAAAAA" opacity="0.5"/>
<rect x="77" y="58" width="47" height="4" rx="1" fill="#AAAAAA" opacity="0.4"/>
</g>
<!-- Time/servings badges -->
<rect id="badge1" opacity="0.35" x="20" y="70" width="28" height="10" rx="5" fill="#AAAAAA"/>
<rect id="badge2" opacity="0.35" x="52" y="70" width="28" height="10" rx="5" fill="#AAAAAA"/>
<rect id="badge3" opacity="0.35" x="84" y="70" width="28" height="10" rx="5" fill="#AAAAAA"/>
</g>
</svg>
